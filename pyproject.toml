[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mbta-tracker"
version = "0.1.0"
description = "MBTA Tracker"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.32",
    "pillow>=11.1",
    "numpy>=2.2",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.16",
    "pyright>=1.1",
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "types-requests",
]

test = [
    "pillow>=11.1",
    "bdflib>=2.1",
]

[tool.hatch.build.targets.wheel]
packages = ["controller"]

[tool.pytest.ini_options]
testpaths = ["controller/test"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.ruff.lint.per-file-ignores]
# argparse --help strings for rpi-rgb-led-matrix flags; not worth hand-wrapping
"controller/displays/adafruit.py" = ["E501"]

[tool.pyright]
venvPath = "."
venv = ".venv"
